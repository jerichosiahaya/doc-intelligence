syntax = "proto3";

package docintel;

service DocIntel {
  rpc Ask(AskRequest) returns (AskReply);
}

message AskRequest {
  string question = 1;
  string doc = 2;              // optional: limit the search to one ingested document
  string conversation_id = 3;  // optional: continue a saved conversation (needs DATABASE_URL)
}

message Source {
  string doc = 1;
  int32 page = 2;
}

message AskReply {
  string answer = 1;
  repeated Source citations = 2;           // cited pages that were retrieved
  bool refused = 3;
  repeated Source retrieved = 4;           // every page sent to the model
  double seconds = 5;
  int64 tokens = 6;
  repeated Source rejected_citations = 7;  // cited pages that were not retrieved
  string conversation_id = 8;              // set when history is on and the turn was saved
}
