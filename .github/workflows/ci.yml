name: ci
on:
  push:
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docintel
          POSTGRES_PASSWORD: docintel
          POSTGRES_DB: docintel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docintel" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://docintel:docintel@localhost:5432/docintel
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q   # model tests are skipped here; run them locally with RUN_MODEL_TESTS=1
