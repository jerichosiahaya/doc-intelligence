# Optional services.
#   qdrant:   a vector database server, so several processes (REST, gRPC, CLI, eval) can share the index.
#             Then set QDRANT_URL=http://localhost:6333 in .env
#   postgres: conversation history. Then set DATABASE_URL=postgresql://docintel:docintel@localhost:5432/docintel
# Start one:  docker compose up -d qdrant     or     docker compose up -d postgres
services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: docintel-qdrant
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"   # local only; set QDRANT_PORT if 6333 is taken
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: docintel-postgres
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docintel}   # development default; change it for any shared host
      POSTGRES_DB: docintel
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # local only; set POSTGRES_PORT if 5432 is taken
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel"]
      interval: 3s
      retries: 20
    restart: unless-stopped

volumes:
  qdrant_storage:
  pg_data:
