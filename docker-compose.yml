# Whole stack:  API_KEY=choose-a-key docker compose up -d --build     (UI at http://localhost:8080)
# One service:  docker compose up -d qdrant     or     docker compose up -d postgres
#   qdrant:   vector database server. For local runs, set QDRANT_URL=http://localhost:6333 in server/.env
#   postgres: conversation history. For local runs, set DATABASE_URL=postgresql://docintel:docintel@localhost:5432/docintel
#   server:   the API (REST on 8000, gRPC on 50051). Reads model settings from server/.env.
#   ui:       the React app behind nginx. It calls the server through /api.
services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: docintel-qdrant
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"   # local only; set QDRANT_PORT if 6333 is taken
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: docintel-postgres
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docintel}   # development default; change it for any shared host
      POSTGRES_DB: docintel
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # local only; set POSTGRES_PORT if 5432 is taken
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  server:
    build: ./server
    container_name: docintel-server
    env_file:
      - path: ./server/.env      # LITELLM_URL, LITELLM_KEY, model names
        required: false
    environment:
      API_KEY: ${API_KEY:-}      # required: the server refuses to listen on 0.0.0.0 without it
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://docintel:${POSTGRES_PASSWORD:-docintel}@postgres:5432/docintel
    ports:
      - "127.0.0.1:${SERVER_PORT:-8000}:8000"
      - "127.0.0.1:${GRPC_PORT:-50051}:50051"
    volumes:
      - server_docs:/app/docs      # PDF copies, for the page images
      - server_cache:/app/.cache   # vision results
      - server_logs:/app/logs
      - models:/models             # local embedding and reranker models
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build: ./ui
    container_name: docintel-ui
    ports:
      - "127.0.0.1:${UI_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  qdrant_storage:
  pg_data:
  server_docs:
  server_cache:
  server_logs:
  models:
